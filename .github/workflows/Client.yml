name: Build Client 🌙

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1.4.1

      - name: Clone ProjectOutlawn
        run: git clone https://github.com/Twig6943/ProjectOutlawn.git

      - name: Build Client
        run: |
          cd ProjectOutlawn\src\Client
          cl /LD dllmain.cpp /link /OUT:dinput8.dll /IMPLIB:dinput8.lib /LIBPATH:libs MinHook.x64.lib

      - name: Upload Compiled DLL
        uses: actions/upload-artifact@v4
        with:
          name: dinput8
          path: ProjectOutlawn/src/Client/dinput8.dll
