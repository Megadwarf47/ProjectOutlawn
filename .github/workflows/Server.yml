name: Build Server 🔥

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Install Visual Studio Build Tools to a specific directory
      - name: Install Visual Studio Build Tools
        shell: pwsh
        run: |
          $vsInstallerUrl = "https://aka.ms/vs/17/release/vs_BuildTools.exe"
          $vsInstallerPath = "$env:RUNNER_TEMP\vs_BuildTools.exe"
          $installDir = "D:\MyVS"

          Invoke-WebRequest $vsInstallerUrl -OutFile $vsInstallerPath

          Start-Process -Wait -FilePath $vsInstallerPath -ArgumentList `
            "--installPath `"$installDir`"", `
            "--add Microsoft.VisualStudio.Workload.VCTools", `
            "--includeRecommended", `
            "--passive", "--norestart", "--wait"

      # Set up the MSVC environment from the known custom path
      - name: Setup MSVC Environment
        shell: cmd
        run: |
          call "D:\MyVS\VC\Auxiliary\Build\vcvars64.bat"

      # Clone the project
      - name: Clone ProjectOutlawn
        run: git clone https://github.com/Twig6943/ProjectOutlawn.git

      # Build the server using CMake + NMake
      - name: Build Server
        shell: cmd
        run: |
          call "D:\MyVS\VC\Auxiliary\Build\vcvars64.bat"
          cd ProjectOutlawn\src\Server
          mkdir build
          cd build
          cmake .. -G "NMake Makefiles"
          cmake --build . --config Release

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: DLL
          path: ProjectOutlawn/src/Server/build/Release*

      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: Installer
          path: ProjectOutlawn/src/Server/build/Installer/Release*

      - name: Upload Launcher
        uses: actions/upload-artifact@v4
        with:
          name: Launcher
          path: ProjectOutlawn/src/Server/build/Launcher/Release*
