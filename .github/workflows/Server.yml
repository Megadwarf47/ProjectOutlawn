name: Build Server 🔥

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Install Visual Studio Build Tools with MSVC C++ workload
      - name: Install Visual Studio Build Tools
        shell: pwsh
        run: |
          Invoke-WebRequest https://aka.ms/vs/17/release/vs_BuildTools.exe -OutFile vs_BuildTools.exe
          Start-Process -Wait -FilePath .\vs_BuildTools.exe -ArgumentList `
            '--quiet', '--wait', '--norestart', `
            '--add', 'Microsoft.VisualStudio.Workload.VCTools', `
            '--includeRecommended', '--passive'

      # Clone your project
      - name: Clone ProjectOutlawn
        run: git clone https://github.com/Twig6943/ProjectOutlawn.git

      # Set up MSVC and build using CMake
      - name: Build Server
        shell: cmd
        run: |
          call "%ProgramFiles(x86)%\Microsoft Visual Studio\2022\BuildTools\VC\Auxiliary\Build\vcvars64.bat"
          cd ProjectOutlawn\src\Server
          mkdir build
          cd build
          cmake .. -G "NMake Makefiles"
          cmake --build . --config Release

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: DLL
          path: ProjectOutlawn/src/Server/build/Release*

      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: Installer
          path: ProjectOutlawn/src/Server/build/Installer/Release*

      - name: Upload Launcher
        uses: actions/upload-artifact@v4
        with:
          name: Launcher
          path: ProjectOutlawn/src/Server/build/Launcher/Release*
