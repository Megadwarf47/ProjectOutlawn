name: Build Server 🔥

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Install Visual Studio Build Tools with MSVC C++ and NMake
      - name: Install Visual Studio Build Tools
        shell: pwsh
        run: |
          Invoke-WebRequest https://aka.ms/vs/17/release/vs_BuildTools.exe -OutFile vs_BuildTools.exe
          Start-Process -Wait -FilePath .\vs_BuildTools.exe -ArgumentList `
            '--quiet', '--wait', '--norestart', `
            '--add', 'Microsoft.VisualStudio.Workload.VCTools', `
            '--add', 'Microsoft.VisualStudio.Workload.Needed', `
            '--includeRecommended', '--passive'

      # Dynamically search for the vcvars64.bat file (detects all possible installation locations)
      - name: Setup MSVC Environment
        shell: pwsh
        run: |
          $vcvarsFile = Get-ChildItem -Path "C:\" -Recurse -Filter "vcvars64.bat" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($vcvarsFile) {
            Write-Host "Found vcvars64.bat at: $($vcvarsFile.FullName)"
            & $vcvarsFile.FullName
          } else {
            Write-Host "vcvars64.bat not found!"
            exit 1
          }

      # Clone your project
      - name: Clone ProjectOutlawn
        run: git clone https://github.com/Twig6943/ProjectOutlawn.git

      # Build Server using CMake with NMake
      - name: Build Server
        shell: cmd
        run: |
          cd ProjectOutlawn\src\Server
          mkdir build
          cd build
          cmake .. -G "NMake Makefiles"
          cmake --build . --config Release

      # Upload DLL
      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: DLL
          path: ProjectOutlawn/src/Server/build/Release*

      # Upload Installer
      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: Installer
          path: ProjectOutlawn/src/Server/build/Installer/Release*

      # Upload Launcher
      - name: Upload Launcher
        uses: actions/upload-artifact@v4
        with:
          name: Launcher
          path: ProjectOutlawn/src/Server/build/Launcher/Release*
