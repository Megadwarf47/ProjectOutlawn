name: Build Server 🔥

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup MSVC Environment
        uses: ilammy/msvc-dev-cmd@v1.4.1

      - name: Install CMake
        run: choco install cmake --yes

      - name: Clone ProjectOutlawn
        run: git clone https://github.com/Twig6943/ProjectOutlawn.git

      - name: Build Server
        run: |
          cd ProjectOutlawn/src/Server
          mkdir build
          cd build
          cmake .. -G "Visual Studio 2022"
          cmake --build . --config Release

      - name: Upload Compiled DLL
        uses: actions/upload-artifact@v4
        with:
          name: Server
          path: ProjectOutlawn/src/Server/build/Release
