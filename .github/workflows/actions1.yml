name: Build Client 🌙

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Visual Studio Build Tools
        uses: microsoft/setup-msbuild@v1  # Using the official setup-msbuild action

      - name: Setup MSVC
        run: |
          # Set up Visual Studio build environment
          call "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\VC\Auxiliary\Build\vcvarsall.bat" x64

      - name: Clone ProjectOutlawn
        run: git clone https://github.com/Twig6943/ProjectOutlawn.git

      - name: Build Client
        run: |
          cd ProjectOutlawn/src/Client
          # Compile using MSVC cl command
          cl /EHsc dllmain.cpp
