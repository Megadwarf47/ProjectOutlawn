name: Build Client 🌙

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Visual Studio Build Tools
        run: |
          # Install Visual Studio Build Tools 2019 (if needed, adjust for your version)
          choco install visualstudio2019buildtools --version=16.11.7 -y

      - name: Setup MSVC
        run: |
          # Use cmd.exe and correctly handle the space in "Program Files"
          cmd.exe /C "\"C:\Program Files (x86)\Microsoft Visual Studio\2019\BuildTools\VC\Auxiliary\Build\vcvarsall.bat\" x64"

      - name: Clone ProjectOutlawn
        run: git clone https://github.com/Twig6943/ProjectOutlawn.git

      - name: Build Client
        run: |
          cd ProjectOutlawn/src/Client
          # Compile using MSVC (cl)
          cmd.exe /C "cl /EHsc your_program.cpp"
