stages:
  - build

build_serverold:
  stage: build
  tags:
    - windows
  script:
    - echo "Checkout Repository"
    - git clone https://github.com/Twig6943/ProjectOutlawn.git

    - echo "Install Visual Studio Build Tools"
    - powershell -Command ^
        $vsInstallerUrl = "https://aka.ms/vs/17/release/vs_BuildTools.exe"; ^
        $vsInstallerPath = "$env:CI_PROJECT_DIR\vs_BuildTools.exe"; ^
        $installDir = "C:\MyVS"; ^
        Invoke-WebRequest $vsInstallerUrl -OutFile $vsInstallerPath; ^
        Start-Process -Wait -FilePath $vsInstallerPath -ArgumentList `
          "--installPath `"$installDir`"", `
          "--add Microsoft.VisualStudio.Workload.VCTools", `
          "--includeRecommended", `
          "--passive", "--norestart", "--wait"

    - echo "Setup MSVC Environment"
    - call "C:\MyVS\VC\Auxiliary\Build\vcvars64.bat"

    - echo "Build ServerOld"
    - call "C:\MyVS\VC\Auxiliary\Build\vcvars64.bat" && ^
      cd ProjectOutlawn\src\ServerOld && ^
      cl /LD dllmain.cpp /link /OUT:dinput8.dll /IMPLIB:dinput8.lib /LIBPATH:libs

  artifacts:
    paths:
      - ProjectOutlawn/src/ServerOld/dinput8.dll
    name: "ServerOld-DLL"
